name: HiveMind evals

# Runs the scenario eval suite and blocks a PR if pass_rate regresses > 2 pts vs main.
#
# NOTE: each scenario is a FULL live orchestrator run (Gemini + the partner MCP servers +
# Redis + Phoenix) that opens & cleans up a real GitLab MR. That's heavy and needs the
# full secret set, so this runs a small smoke subset (--limit 3) and is also exposed via
# workflow_dispatch for manual full runs. For the complete 20-scenario suite, prefer a
# self-hosted runner.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of scenarios to run"
        default: "3"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mechanically-enforced taste (T19): structural gate — fast, no secrets. The expensive
  # live eval job below only runs if this passes.
  taste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Structural taste checks (AGENTS.md, contract schema, agent tools)
        run: python harness/check_taste.py

  evals:
    needs: taste
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports: ["6379:6379"]
      phoenix:
        image: arizephoenix/phoenix:latest
        ports: ["6006:6006"]
    env:
      REDIS_URL: redis://localhost:6379
      PHOENIX_HOST: http://localhost:6006
      PHOENIX_COLLECTOR_ENDPOINT: http://localhost:6006
      # Agents (and the eval judge) use Vertex, authenticated via the GCP service-account
      # key below — NOT the Developer-API GOOGLE_API_KEY (separate, depleted pool).
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
      FIVETRAN_API_KEY: ${{ secrets.FIVETRAN_API_KEY }}
      FIVETRAN_API_SECRET: ${{ secrets.FIVETRAN_API_SECRET }}
      FIVETRAN_GROUP_ID: ${{ secrets.FIVETRAN_GROUP_ID }}
      GITLAB_URL: ${{ secrets.GITLAB_URL }}
      GITLAB_BOT_TOKEN: ${{ secrets.GITLAB_BOT_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_TARGET_PROJECT: ${{ secrets.GITLAB_TARGET_PROJECT }}
      DT_ENVIRONMENT: ${{ secrets.DT_ENVIRONMENT }}
      DT_PLATFORM_TOKEN: ${{ secrets.DT_PLATFORM_TOKEN }}
      DT_API_TOKEN: ${{ secrets.DT_API_TOKEN }}
      ELASTIC_CLOUD_ID: ${{ secrets.ELASTIC_CLOUD_ID }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
      MDB_URI: ${{ secrets.MDB_URI }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v4
      # Authenticate to GCP so the agents reach Gemini via Vertex (sets ADC for the run).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - name: Seed Dynatrace logs + critic prompt
        run: |
          python scripts/seed_dynatrace.py || true
          python scripts/seed_critic_prompt.py || true
      - name: Run scenario evals (smoke subset)
        run: python evals/runner.py --limit ${{ github.event.inputs.limit || '3' }} --no-judge
      - name: Gate against main baseline
        run: python evals/ci_gate.py
      - name: Comment results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('evals/pr_comment.md', 'utf8');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Update baseline on main
        if: github.ref == 'refs/heads/main' && success()
        run: python evals/ci_gate.py --update
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/last_run.json
